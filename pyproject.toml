[project]
name = "cicerone"
version = "0.4.0"
description = "Turn OpenAPI schemas into Pydantic models"
authors = [{ name = "Paul Hallett", email = "paulandrewhallett@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "pyyaml>=6.0.1"]

[project.urls]
Homepage = "https://phalt.github.io/cicerone/"
Changelog = "https://phalt.github.io/cicerone/CHANGELOG/"
Documentation = "https://phalt.github.io/cicerone/"
Issues = "https://github.com/phalt/cicerone/issues"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "ipython>=8.14.0",
    "mkdocs>=1.4.3",
    "mkdocs-material>=9.1.19",
    "ty>=0.0.4",
    "pytest>=7.4.0",
    "pytest-benchmark>=5.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.1.2",
    "types-pyyaml>=6.0.12.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cicerone"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # Ruff-specific rules
    "RUF",
    # flake8-type-checking
    "TC",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# Fails CI once an API lands and its ty: ignore in tests/regressions goes stale
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.report]
# Ratchet: raise this whenever coverage goes up, never lower it
fail_under = 97.76
precision = 2
