name: CI - Lint and Test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Report every Python version rather than cancelling the rest on the first failure
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}
          # Falls back to a pre-release when no final build of the newest version exists yet
          allow-prereleases: true
      #----------------------------------------------
      #  -----  install & configure uv  -----
      #----------------------------------------------
      - name: Install UV
        # setup-uv stopped publishing floating major tags after v7, so pin the release
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      #----------------------------------------------
      # install dependencies
      #----------------------------------------------
      - name: Install dependencies
        run: uv sync --frozen
      #----------------------------------------------
      # Run linting and tests
      #----------------------------------------------
      - name: Ruff format check
        run: |
          uv run ruff format --check cicerone tests
      - name: Ruff linting
        run: |
          uv run ruff check .
      - name: Type check with ty
        run: |
          uv run ty check .
      - name: Test with pytest
        run: |
          uv run pytest -vv --cov=cicerone --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
