name: CI - Lint and Test

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Report every Python version rather than cancelling the rest on the first failure
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python-version}}
          # Falls back to a pre-release when no final build of the newest version exists yet
          allow-prereleases: true
      #----------------------------------------------
      #  -----  install & configure uv  -----
      #----------------------------------------------
      - name: Install UV
        # setup-uv stopped publishing floating major tags after v7, so pin the release
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      #----------------------------------------------
      # install dependencies
      #----------------------------------------------
      - name: Install dependencies
        run: uv sync --frozen
      #----------------------------------------------
      # Run linting and tests
      #----------------------------------------------
      - name: Ruff format check
        run: |
          uv run ruff format --check cicerone tests
      - name: Ruff linting
        run: |
          uv run ruff check .
      - name: Type check with ty
        run: |
          uv run ty check .
      - name: Test with pytest
        run: |
          uv run pytest -vv --cov=cicerone --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}

  clientele-smoke:
    # Generate and import a clientele client for every clientele fixture using
    # this cicerone. Informational until the release gate (tasks/todo.md Task 36)
    # makes it blocking.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out cicerone
        uses: actions/checkout@v7
      - name: Check out clientele main
        uses: actions/checkout@v7
        with:
          repository: phalt/clientele
          path: clientele
      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install UV
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install cicerone
        run: uv sync --frozen
      - name: Install clientele against this cicerone
        # clientele pins an older cicerone, so install it without dependencies
        # and add its other requirements separately
        run: |
          uv pip install --no-deps ./clientele
          uv pip install $(uv run --no-sync python scripts/clientele_smoke.py requirements ./clientele)
      - name: Generate and import every clientele fixture
        run: uv run --no-sync python scripts/clientele_smoke.py run ./clientele
